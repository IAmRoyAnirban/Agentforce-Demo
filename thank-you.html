<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4f46e5, #6d28d9);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 16px;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.9s ease-in-out;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #ffffff;
            color: #4f46e5;
            padding: 12px 26px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .btn:hover {
            background: #e0e0ff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎉 Thank You!</h1>
        <p>Your submission has been received. We appreciate your interest!</p>

        <a href="index.html" class="btn">Go Back Home</a>
    </div>
</body>
</html>
